spring.application.name=backend

# Lokale Konfiguration aus .env laden; echte Umgebungsvariablen haben Vorrang.
spring.config.import=optional:file:.env[.properties]

# Port des Backends: Umgebungsvariable PORT (Heroku), sonst 8080
server.port=${PORT:8080}

# Datenbankverbindungsinformationen (PostgreSQL)
# Heroku setzt JDBC_DATABASE_URL / JDBC_DATABASE_USERNAME / JDBC_DATABASE_PASSWORD,
# lokal greifen DB_URL / DB_USERNAME / DB_PASSWORD aus der .env.
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/lookupstock}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Frontend origins for local development and later deployment
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://localhost:5173,https://lookupstockfrontend-96a9998805cb.herokuapp.com}

# Von Actuator nur /actuator/health freigeben
management.endpoints.web.exposure.include=health

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Zeitstempel immer in UTC speichern und lesen, unabhaengig von der Server-Zeitzone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Datumswerte als ISO-8601-Text ausgeben (z. B. "2026-10-14T12:00:00Z"), nicht als Zahl.
# Jackson 3 / Spring Boot 4: Das Feature liegt unter datatype.datetime, nicht mehr unter serialization.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Twelve Data (Kursdaten-API); API-Key kommt aus .env bzw. Umgebungsvariable
twelvedata.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
twelvedata.api-key=${TWELVE_DATA_API_KEY}
# GraphQL (BE #94): Endpunkt unter /api/v1 wie alle anderen Endpunkte (NF-15)
spring.graphql.http.path=/api/v1/graphql
# GraphiQL-Oberfläche zum Ausprobieren nur lokal einschalten (GRAPHIQL_ENABLED=true in der .env)
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}
