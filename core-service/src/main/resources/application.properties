spring.application.name=core-service

spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Heroku sets JDBC_DATABASE_URL/USERNAME/PASSWORD; locally DB_URL/DB_USERNAME/DB_PASSWORD from .env are used.
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/lookupstock}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
# Both apps share the connection limit of the Heroku database.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://localhost:5173,https://lookupstockfrontend-96a9998805cb.herokuapp.com}

management.endpoints.web.exposure.include=health

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson 3 / Spring Boot 4: the feature lives under datatype.datetime.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

marktdaten.base-url=${MARKTDATEN_URL:http://localhost:8081}
marktdaten.internal-api-key=${INTERNAL_API_KEY:}
spring.graphql.http.path=/api/v1/graphql
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}

app.queue.poll-interval-ms=${QUEUE_POLL_INTERVAL_MS:5000}