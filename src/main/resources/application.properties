spring.application.name=backend

# Lokale Konfiguration aus .env laden; echte Umgebungsvariablen haben Vorrang.
spring.config.import=optional:file:.env[.properties]

# Port des Backends: Umgebungsvariable PORT, sonst 8080
server.port=${PORT:8080}

# Frontend-Adressen, die das Backend aufrufen duerfen (wird in CorsConfig gelesen)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Von Actuator nur /actuator/health freigeben
management.endpoints.web.exposure.include=health

# Datenbankverbindungsinformationen (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/V1_portfolio.sql}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Zeitstempel immer in UTC speichern und lesen, unabhaengig von der Server-Zeitzone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Datumswerte als ISO-8601-Text ausgeben (z. B. "2026-10-14T12:00:00Z"), nicht als Zahl.
# Jackson 3 / Spring Boot 4: Das Feature liegt unter datatype.datetime, nicht mehr unter serialization.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Twelve Data (Kursdaten-API); API-Key kommt aus .env bzw. Umgebungsvariable
twelvedata.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
twelvedata.api-key=${TWELVE_DATA_API_KEY}
