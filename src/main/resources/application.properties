spring.application.name=backend

# Heroku / deployment configuration
server.port=${PORT:8080}

# Local database defaults; Heroku will inject JDBC_DATABASE_URL / JDBC_DATABASE_USERNAME / JDBC_DATABASE_PASSWORD
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/lookupstock}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Frontend origins for local development and later deployment
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:5173,https://your-frontend.herokuapp.com}

# Actuator exposure
management.endpoints.web.exposure.include=health