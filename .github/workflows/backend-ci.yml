name: Backend CI (core-service)

on:
  push:
    branches: [main]
    paths:
      - 'core-service/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core-service/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # ADR-07: Der bisherige Backend-Code liegt im Ordner core-service
    defaults:
      run:
        working-directory: core-service

    # PostgreSQL-Datenbank fuer die Tests (Flyway migriert das Schema beim Start,
    # danach prueft Hibernate es mit ddl-auto=validate)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lookupstock_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Werden von application.properties gelesen
    env:
      DB_URL: jdbc:postgresql://localhost:5432/lookupstock_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Dummy-Wert, damit der Spring-Kontext startet; Tests rufen die echte API nicht auf
      TWELVE_DATA_API_KEY: ci-dummy-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core-service/pom.xml

      - name: Maven Wrapper ausfuehrbar machen
        run: chmod +x mvnw

      - name: Build & Tests
        run: ./mvnw -B verify

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: core-service/target/surefire-reports/
          if-no-files-found: ignore

       # Abdeckung der Kernlogik in der Zusammenfassung des CI-Laufs anzeigen (NF-11)
      - name: Abdeckung der Kernlogik
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "Kein JaCoCo-Bericht vorhanden." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, -v core="ParameterEstimator MonteCarloEngine MetricsCalculator SimulationService ComparisonService Portfolio PortfolioService" '
            BEGIN { n = split(core, names, " "); for (i = 1; i <= n; i++) wanted[names[i]] = 1 }
            # Spalte 3 ist die Klasse; innere Klassen (z. B. Portfolio.Builder) zählen zur äußeren
            NR > 1 { cls = $3; sub(/\..*/, "", cls); if (cls in wanted) { missed += $8; covered += $9 } }
            END {
              total = missed + covered
              printf "### Testabdeckung Kernlogik (NF-11)\n\n%d von %d Zeilen = **%.1f %%** (Zielwert 80 %%)\n", covered, total, (total ? 100 * covered / total : 0)
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"

      - name: JaCoCo-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: core-service/target/site/jacoco/
          if-no-files-found: ignore