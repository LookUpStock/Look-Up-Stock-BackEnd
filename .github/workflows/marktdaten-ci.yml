name: Backend CI (marktdaten-service)

on:
  push:
    branches: [main]
    paths: ['marktdaten-service/**', '.github/workflows/marktdaten-ci.yml']
  pull_request:
    branches: [main]
    paths: ['marktdaten-service/**', '.github/workflows/marktdaten-ci.yml']
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: marktdaten-service

    # Die Tests brauchen keine Datenbank und rufen Twelve Data nicht auf (NF-12):
    # Controller mit MockMvc, Services mit Mockito. Darum kein PostgreSQL-Container.
    env:
      # Dummy-Werte; echte Schlüssel stehen nur in den Heroku-Konfigurationsvariablen
      TWELVE_DATA_API_KEY: ci-dummy-key
      INTERNAL_API_KEY: ci-dummy-internal-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: marktdaten-service/pom.xml

      - name: Maven Wrapper ausfuehrbar machen
        run: chmod +x mvnw

      - name: Build & Tests
        run: ./mvnw -B verify

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marktdaten-surefire-reports
          path: marktdaten-service/target/surefire-reports/
          if-no-files-found: ignore

      - name: JaCoCo-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marktdaten-jacoco-report
          path: marktdaten-service/target/site/jacoco/
          if-no-files-found: ignore
