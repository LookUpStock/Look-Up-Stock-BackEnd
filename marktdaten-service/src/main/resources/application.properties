spring.application.name=marktdaten-service

spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8081}

# Same PostgreSQL database as the core service; Heroku sets JDBC_DATABASE_URL etc.
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/lookupstock}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
# Both apps share the connection limit of the Heroku database.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Own schema with its own Flyway history.
spring.flyway.schemas=marktdaten
spring.flyway.default-schema=marktdaten

management.endpoints.web.exposure.include=health

spring.jackson.datatype.datetime.write-dates-as-timestamps=false

twelvedata.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
twelvedata.api-key=${TWELVE_DATA_API_KEY}

marktdaten.internal-api-key=${INTERNAL_API_KEY:}

# Interval keeps preloading within the Twelve Data quota (8 requests per minute on the free plan).
app.queue.preload-interval-ms=${QUEUE_PRELOAD_INTERVAL_MS:15000}
