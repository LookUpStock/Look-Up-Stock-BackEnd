spring.application.name=marktdaten-service

# Lokale Konfiguration aus .env laden; echte Umgebungsvariablen haben Vorrang.
spring.config.import=optional:file:.env[.properties]

# Port: Umgebungsvariable PORT (Heroku), lokal 8081, damit der core-service 8080 behält
server.port=${PORT:8081}

# Dieselbe PostgreSQL-Datenbank wie der core-service (ADR-07), Heroku setzt JDBC_DATABASE_URL usw.
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/lookupstock}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
# Beide Apps teilen sich die Verbindungen der Heroku-Datenbank (ADR-07, Konsequenzen)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Eigenes Schema; Flyway legt es an und führt dort eine eigene Migrationshistorie
spring.flyway.schemas=marktdaten
spring.flyway.default-schema=marktdaten

# Von Actuator nur /actuator/health freigeben
management.endpoints.web.exposure.include=health

# Datumswerte als ISO-8601-Text ausgeben (z. B. "2026-08-01")
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Twelve Data: API-Key liegt nur noch in diesem Dienst (ADR-07)
twelvedata.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
twelvedata.api-key=${TWELVE_DATA_API_KEY}

# Gemeinsamer Schlüssel mit dem core-service; ohne Wert werden alle Anfragen an /internal abgewiesen
marktdaten.internal-api-key=${INTERNAL_API_KEY:}
